<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="ELEVATE platform overview banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1b2366"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="260" fill="#3a86ff" opacity="0.12"/>
  <circle cx="1080" cy="120" r="170" fill="#3a86ff" opacity="0.16"/>
  <rect x="120" y="150" width="500" height="8" rx="4" fill="#7ea6ff"/>
  <text x="120" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff">ELEVATE</text>
  <text x="122" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cfe0ff">A modular platform for modern operations</text>

  <!-- Module cards -->
  <g>
    <rect x="620" y="120" width="180" height="120" rx="12" fill="url(#card)" opacity="0.92"/>
    <rect x="636" y="138" width="24" height="24" rx="5" fill="#2c64d6"/>
    <circle cx="648" cy="150" r="5" fill="#fff"/>
    <text x="636" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1030">Identity</text>
    <text x="636" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#44508a">Entra ID · SSO · RBAC</text>

    <rect x="828" y="120" width="180" height="120" rx="12" fill="url(#card)" opacity="0.92"/>
    <rect x="844" y="138" width="24" height="24" rx="5" fill="#2c64d6"/>
    <circle cx="856" cy="150" r="5" fill="#fff"/>
    <text x="844" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1030">Data</text>
    <text x="844" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#44508a">PostgreSQL · Drizzle ORM</text>

    <rect x="1036" y="120" width="180" height="120" rx="12" fill="url(#card)" opacity="0.92"/>
    <rect x="1052" y="138" width="24" height="24" rx="5" fill="#2c64d6"/>
    <circle cx="1064" cy="150" r="5" fill="#fff"/>
    <text x="1052" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1030">Workflows</text>
    <text x="1052" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#44508a">API-first · Events</text>
  </g>

  <!-- Pipeline line -->
  <g stroke="#7ea6ff" stroke-width="3" fill="none" opacity="0.7">
    <path d="M120 560 C 320 500, 480 470, 640 500 S 1000 520, 1160 470"/>
  </g>
  <g fill="#9dffb0" opacity="0.9">
    <circle cx="640 " cy="500" r="7"/>
    <circle cx="520" cy="486" r="7"/>
    <circle cx="760" cy="500" r="7"/>
    <circle cx="900" cy="505" r="7"/>
  </g>
  <text x="120" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#cfe0ff">Governed delivery pipeline — CI/CD · previews · quality gates</text>
</svg>